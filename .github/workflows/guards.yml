name: Guards

# Our own shipped tools, run against this repo. If they are worth shipping they
# are worth depending on ourselves — a guard that never runs on our own code is
# an untested guard.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install-script audit
        run: npx --yes npm-script-lens@latest audit --path .

      # Version cooldown: npm worms are typically identified within hours, so
      # refuse to be among the first to install a brand-new version.
      - name: Dependency cooldown
        run: npx --yes npm-script-lens@latest audit --path . --cooldown

      - name: TypeScript 7 readiness
        uses: Booyaka101/ts7-compat-guard@v3

      # Drift gate: fails if a dependency gains an install script nobody approved.
      - name: Allowlist drift
        continue-on-error: true
        run: npx --yes npm-script-lens@latest sync --path . --check

      # Shell/Dockerfile/Terraform/PHP — the file types GitHub gated behind paid
      # Advanced Security. This repo ships a Dockerfile. Reports without gating.
      - name: Free GHAS-equivalent scan
        continue-on-error: true
        uses: Booyaka101/ghas-free-pack@v1
        with:
          github-token: ${{ github.token }}
