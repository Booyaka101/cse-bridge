name: Publish

# Tag a release to publish both artifacts:
#   git tag v1.0.0 && git push origin v1.0.0
#
# npm authenticates by OIDC (trusted publishing) rather than a long-lived
# token, so provenance is generated automatically and no NPM_TOKEN exists to be
# stolen. GHCR still uses the built-in GITHUB_TOKEN.
#
# The npmjs.com side must name this file: Booyaka101 / cse-bridge /
# publish.yml. Renaming this file breaks publishing until that entry matches.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The whole mechanism: without it there is no OIDC token to exchange.
      # Deliberately no NODE_AUTH_TOKEN anywhere in this job, since a token
      # alongside this grant makes npm prefer the token and skip the exchange.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing needs npm >= 11.5.1 and Node >= 22.14.0. Node 22
      # still bundles npm 10, so the runner's default is below the floor.
      - name: Meet the trusted-publishing version floor
        run: |
          set -euo pipefail
          npm install -g npm@^11.5.1
          node --version
          npm --version

      - run: npm ci
      - run: npm test

      # The gate used to ask whether an NPM_TOKEN existed. There is no token
      # now, so the only question left is whether this version is already out.
      - name: Publish to npm
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          if npm view "cse-bridge@$VERSION" version >/dev/null 2>&1; then
            echo "cse-bridge@$VERSION is already on the registry, nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            npm publish --access public
            echo "Published cse-bridge@$VERSION with provenance." >> "$GITHUB_STEP_SUMMARY"
          fi

  ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
