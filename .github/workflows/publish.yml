name: Publish

# Tag a release to publish both artifacts:
#   git tag v1.0.0 && git push origin v1.0.0
#
# npm needs an NPM_TOKEN repository secret. GHCR uses the built-in GITHUB_TOKEN.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # --provenance below signs through OIDC and fails without it
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm ci
      - run: npm test
      - name: Decide whether to publish
        id: gate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ -z "$NPM_TOKEN" ]; then
            echo "skip=no NPM_TOKEN secret configured" >> "$GITHUB_OUTPUT"
          elif npm view "cse-bridge@$VERSION" version > /dev/null 2>&1; then
            echo "skip=cse-bridge@$VERSION is already on the registry" >> "$GITHUB_OUTPUT"
          else
            echo "skip=" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.gate.outputs.skip != ''
        run: echo "Skipping npm publish - ${{ steps.gate.outputs.skip }}"
      - if: steps.gate.outputs.skip == ''
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  ghcr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
