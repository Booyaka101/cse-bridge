name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Our own tool. Locks the runner image's tool versions and diffs them when
      # GitHub bumps the image — including when a floating label like
      # ubuntu-latest silently re-points. Report-only; no fail-on yet.
      - name: Runner image drift
        uses: Booyaka101/runner-drift@v1
        with:
          fail-on-retirement: 60
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Start the compose stack
        run: docker compose up -d --build
      - name: Wait for the bridge to report healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/healthz > /dev/null; then exit 0; fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: End-to-end against the real stack
        run: CSE_BRIDGE_LIVE=1 SEARXNG_URL=http://localhost:8888 npm test
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs
