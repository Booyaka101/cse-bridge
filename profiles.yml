# cse-bridge profiles: map each `cx` your clients already send onto a backend
# configuration. An unknown cx falls back to `default`, so a client you cannot
# edit keeps working the moment you point it at this bridge.
#
# Keys per profile (all optional):
#   engines:     SearXNG engine names. Empty = whatever the instance enables.
#   categories:  SearXNG categories, e.g. general, news, it, science.
#   sites:       only return results from these sites. Google's PSE patterns:
#                example.com (and its subdomains), *.example.com,
#                example.com/docs/* (a path), example.com/page (one page).
#                `cse-bridge import` writes this from your PSE's own files.
#   exclude:     never return results from these, even if `sites` matches.
#   site:        1.2 spelling of a one-entry `sites`; still accepted.
#   language:    fallback language when the client sends neither lr nor hl.
#   pagemap:     true|false. Reconstruct item.pagemap for this cx by fetching
#                result pages. Overrides CSE_BRIDGE_PAGEMAP either way; omit
#                the key to follow the environment.
#   description: free text, for your own reference.

default:
  description: General web search across the instance's enabled engines.
  engines: []
  categories: [general]

# Example: an existing PSE that only ever searched your docs site. Point its cx
# here and the same client code keeps returning the same shape of results.
docs:
  description: Documentation-only search.
  categories: [general]
  sites: [docs.rs]
  # pagemap: true        # rebuild item.pagemap for this cx, see README

news:
  description: Recent news across the instance's news engines.
  categories: [news]

code:
  description: Developer-oriented search (IT category).
  categories: [it]
